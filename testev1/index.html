<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
    }

    #painel {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 10px;
        z-index: 10;
        width: 250px;
    }

    h2 {
        margin-top: 0;
    }

    button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
</head>

<body>

<div id="painel">
    <h2>Cubo Mágico 3D</h2>

    <b>Controles:</b><br><br>

    U → Girar face superior<br>
    F → Girar face frontal<br><br>

    Mouse → mover câmera<br>
    Scroll → zoom<br><br>

    <button onclick="embaralhar()">
        Embaralhar
    </button>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';

////////////////////////////////////////////////////
// CENA
////////////////////////////////////////////////////

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(7, 7, 7);

////////////////////////////////////////////////////
// RENDERER
////////////////////////////////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(0x111111);

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////
// CONTROLES
////////////////////////////////////////////////////

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

////////////////////////////////////////////////////
// LUZ
////////////////////////////////////////////////////

const luz = new THREE.DirectionalLight(0xffffff, 2);

luz.position.set(10, 10, 10);

scene.add(luz);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));

////////////////////////////////////////////////////
// CUBO MÁGICO
////////////////////////////////////////////////////

const cubos = [];

const TAM = 0.98;

function criarCubinho(x, y, z) {

    const geometry = new THREE.BoxGeometry(
        TAM,
        TAM,
        TAM
    );

    const materiais = [

        // direita
        new THREE.MeshPhongMaterial({
            color: x === 1 ? 0xff0000 : 0x222222
        }),

        // esquerda
        new THREE.MeshPhongMaterial({
            color: x === -1 ? 0xff8800 : 0x222222
        }),

        // topo
        new THREE.MeshPhongMaterial({
            color: y === 1 ? 0xffff00 : 0x222222
        }),

        // baixo
        new THREE.MeshPhongMaterial({
            color: y === -1 ? 0xffffff : 0x222222
        }),

        // frente
        new THREE.MeshPhongMaterial({
            color: z === 1 ? 0x00ff00 : 0x222222
        }),

        // trás
        new THREE.MeshPhongMaterial({
            color: z === -1 ? 0x0000ff : 0x222222
        })

    ];

    const cubo = new THREE.Mesh(
        geometry,
        materiais
    );

    cubo.position.set(x, y, z);

    scene.add(cubo);

    cubos.push(cubo);
}

for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {

            criarCubinho(x, y, z);

        }
    }
}

////////////////////////////////////////////////////
// ANIMAÇÃO DAS FACES
////////////////////////////////////////////////////

let animando = false;

function girarFace(eixo, camada, sentido = 1) {

    if (animando) return;

    animando = true;

    const grupo = new THREE.Group();

    scene.add(grupo);

    const selecionados = cubos.filter(c => {

        return Math.round(c.position[eixo]) === camada;

    });

    selecionados.forEach(c => grupo.add(c));

    let angulo = 0;

    function animar() {

        requestAnimationFrame(animar);

        const passo = 0.08 * sentido;

        grupo.rotation[eixo] += passo;

        angulo += Math.abs(passo);

        if (angulo >= Math.PI / 2) {

            grupo.rotation[eixo] =
                Math.sign(sentido) * Math.PI / 2;

            grupo.updateMatrixWorld();

            selecionados.forEach(c => {

                c.applyMatrix4(grupo.matrix);

                scene.add(c);

                c.position.x = Math.round(c.position.x);
                c.position.y = Math.round(c.position.y);
                c.position.z = Math.round(c.position.z);

            });

            scene.remove(grupo);

            animando = false;

            return;
        }
    }

    animar();
}

////////////////////////////////////////////////////
// TECLADO
////////////////////////////////////////////////////

document.addEventListener("keydown", (e) => {

    switch (e.key.toLowerCase()) {

        case "u":
            girarFace("y", 1, 1);
            break;

        case "f":
            girarFace("z", 1, 1);
            break;
    }
});

////////////////////////////////////////////////////
// EMBARALHAR
////////////////////////////////////////////////////

window.embaralhar = function() {

    const movimentos = [

        () => girarFace("y", 1, 1),
        () => girarFace("y", 1, -1),

        () => girarFace("z", 1, 1),
        () => girarFace("z", 1, -1)

    ];

    let contador = 0;

    const intervalo = setInterval(() => {

        if (animando) return;

        movimentos[
            Math.floor(Math.random() * movimentos.length)
        ]();

        contador++;

        if (contador >= 10) {

            clearInterval(intervalo);

        }

    }, 700);
};

////////////////////////////////////////////////////
// RESPONSIVIDADE
////////////////////////////////////////////////////

window.addEventListener("resize", () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
