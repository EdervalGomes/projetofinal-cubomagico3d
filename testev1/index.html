<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo Mágico 3D</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
    }

    #painel {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0,0,0,0.7);
        padding: 15px;
        border-radius: 10px;
        z-index: 10;
        width: 250px;
    }

    h2 {
        margin-top: 0;
    }

    button {
        margin-top: 10px;
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        background-color: #3f51b5;
        color: white;
    }
    
    button:hover {
        background-color: #5c6bc0;
    }
</style>
</head>

<body>

<div id="painel">
    <h2>Cubo Mágico 3D</h2>

    <b>Controles:</b><br><br>

    U → Girar face superior<br>
    F → Girar face frontal<br><br>

    Mouse → mover câmera<br>
    Scroll → zoom<br><br>

    <button onclick="window.embaralhar()">
        Embaralhar
    </button>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  
  <script type="module">
  // Agora as importações ficam limpas e conversam entre si sem dar erro de rota!
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  
  ////////////////////////////////////////////////////
  // CENA E CÂMERA
  ////////////////////////////////////////////////////
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
  );
  camera.position.set(6, 6, 6);
  
  ////////////////////////////////////////////////////
  // RENDERER
  ////////////////////////////////////////////////////
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x111111);
  document.body.appendChild(renderer.domElement);
  
  ////////////////////////////////////////////////////
  // CONTROLES E LUZ
  ////////////////////////////////////////////////////
  
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  ////////////////////////////////////////////////////
  // CRIAÇÃO DO CUBO MÁGICO (Usando Material Básico para garantir)
  ////////////////////////////////////////////////////
  
  const cubos = [];
  const TAM = 0.95;
  
  function criarCubinho(x, y, z) {
      const geometry = new THREE.BoxGeometry(TAM, TAM, TAM);
  
      const materiais = [
          // direita (X+) -> Vermelho
          new THREE.MeshBasicMaterial({ color: x === 1 ? 0xff0000 : 0x000000 }),
          // esquerda (X-) -> Laranja
          new THREE.MeshBasicMaterial({ color: x === -1 ? 0xff8800 : 0x000000 }),
          // topo (Y+) -> Amarelo
          new THREE.MeshBasicMaterial({ color: y === 1 ? 0xffff00 : 0x000000 }),
          // baixo (Y-) -> Branco
          new THREE.MeshBasicMaterial({ color: y === -1 ? 0xffffff : 0x000000 }),
          // frente (Z+) -> Verde
          new THREE.MeshBasicMaterial({ color: z === 1 ? 0x00ff00 : 0x000000 }),
          // trás (Z-) -> Azul
          new THREE.MeshBasicMaterial({ color: z === -1 ? 0x0000ff : 0x000000 })
      ];
  
      const cubo = new THREE.Mesh(geometry, materiais);
      cubo.position.set(x, y, z);
      scene.add(cubo);
      cubos.push(cubo);
  }
  
  for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
              criarCubinho(x, y, z);
          }
      }
  }
  
  ////////////////////////////////////////////////////
  // SISTEMA DE ANIMAÇÃO DE FACES
  ////////////////////////////////////////////////////
  
  let animando = false;
  
  function girarFace(eixo, camada, sentido = 1) {
      if (animando) return;
      animando = true;
  
      const grupo = new THREE.Group();
      scene.add(grupo);
  
      const selecionados = cubos.filter(c => Math.round(c.position[eixo]) === camada);
      selecionados.forEach(c => grupo.add(c));
  
      let anguloAcumulado = 0;
      const velocidade = 0.08 * sentido;
      const alvo = Math.PI / 2;
  
      function rodarGiro() {
          grupo.rotation[eixo] += velocidade;
          anguloAcumulado += Math.abs(velocidade);
  
          if (anguloAcumulado >= alvo) {
              const diferenca = anguloAcumulado - alvo;
              grupo.rotation[eixo] -= diferenca * sentido;
              grupo.updateMatrixWorld();
  
              selecionados.forEach(c => {
                  c.applyMatrix4(grupo.matrix);
                  scene.add(c);
                  
                  c.position.x = Math.round(c.position.x);
                  c.position.y = Math.round(c.position.y);
                  c.position.z = Math.round(c.position.z);
              });
  
              scene.remove(grupo);
              animando = false;
          } else {
              requestAnimationFrame(rodarGiro);
          }
      }
  
      rodarGiro();
  }
  
  ////////////////////////////////////////////////////
  // MAPEAMENTO DO TECLADO
  ////////////////////////////////////////////////////
  
  document.addEventListener("keydown", (e) => {
      switch (e.key.toLowerCase()) {
          case "u":
              girarFace("y", 1, -1);
              break;
          case "f":
              girarFace("z", 1, -1);
              break;
      }
  });
  
  ////////////////////////////////////////////////////
  // FUNÇÃO EMBARALHAR (GLOBAL)
  ////////////////////////////////////////////////////
  
  window.embaralhar = function() {
      const movimentos = [
          () => girarFace("y", 1, 1),
          () => girarFace("y", 1, -1),
          () => girarFace("z", 1, 1),
          () => girarFace("z", 1, -1)
      ];
  
      let contador = 0;
      const intervalo = setInterval(() => {
          if (animando) return;
  
          movimentos[Math.floor(Math.random() * movimentos.length)]();
          contador++;
  
          if (contador >= 10) {
              clearInterval(intervalo);
          }
      }, 400);
  };
  
  ////////////////////////////////////////////////////
  // RESPONSIVIDADE
  ////////////////////////////////////////////////////
  
  window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  ////////////////////////////////////////////////////
  // LOOP PRINCIPAL DE RENDERIZAÇÃO
  ////////////////////////////////////////////////////
  
  function loopPrincipal() {
      requestAnimationFrame(loopPrincipal);
      controls.update();
      renderer.render(scene, camera);
  }
  
  loopPrincipal();
  
  </script>

</body>
</html>
